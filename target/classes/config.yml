# ============================================================
#  OfficialAuthentication v1.3.0  ——  主配置文件
# ============================================================
#  本文件只放「开关」与「连接」相关的设置。
#
#    插件文字输出 (提示语/指令消息/启动横幅)  -> lang.yml
#    占位符显示内容 (✔正版 / ✘离线 等)       -> placeholders.yml
#
#  安装步骤:
#    1. 插件放进「正版认证服」与「主服」两边的 plugins/
#    2. 两边的 database 段填同一个数据库
#    3. 正版认证服 server.mode: AUTH ; 主服 server.mode: MAIN
#    4. 认证服 online-mode: true ; 主服 online-mode: false
# ============================================================

server:
  # 服务端角色:
  #   AUTH = 正版认证服 (online-mode: true)  —— 全服唯一可写库的一端
  #   MAIN = 主服       (online-mode: false) —— 只读数据库, 只做识别展示
  mode: MAIN
  # 数据库操作线程数
  db-threads: 2
  # 调试日志
  debug: false

# ============================================================
#  功能开关: false = 关闭该功能(改完执行 /oauth reload 即可生效)
# ============================================================
features:
  # ---------- 正版认证服(AUTH) ----------
  # 玩家进入正版服后自动认证写库
  auth-record: true
  # 身份链 / 改名追踪: 关闭后改名不保留历史(同一个账号可能出现多条记录, 不推荐)
  name-chain: true
  # 改名后旧 ID 自动失效: 关闭后旧 ID 依然显示正版(不推荐)
  legacy-name-invalidate: true
  # 旧 ID 在占位符里直接当作离线玩家:
  #   true  = 旧 ID 与从未认证过的玩家表现完全一致(不暴露原正版信息, 推荐)
  #   false = 旧 ID 显示为 placeholders.yml 里的 status.former 文案并带出原身份信息
  legacy-name-offline: true

  # ---------- 主服(MAIN) ----------
  # 主服识别查询总开关: false = 完全不查库, 占位符与 /zb 一律返回离线
  main-recognition: true
  # 玩家登录前异步预查询(进服瞬间就有数据)
  login-pre-query: true
  # 查询结果缓存: false = 每次请求都查库(不推荐)
  cache: true
  # 玩家退出立刻清空其缓存
  cache-clear-on-quit: true
  # 查询时同时取出改名历史(关闭可省一次 SQL)
  name-history-fetch: true

  # ---------- 其它 ----------
  # 注册 PlaceholderAPI 占位符
  placeholder-api: true
  # 注册 /zb 指令(名称与权限见下方 command 段, 文案在 lang.yml)
  zb-command: true
  # 定时清理过期认证数据(详细设置见下方 cleanup 段)
  cleanup: true

# ============================================================
#  数据库
# ============================================================
database:
  host: 127.0.0.1
  port: 3306
  database: minecraft
  username: root
  password: 'your_password'
  # 所有表名前缀
  table-prefix: 'officialauth_'
  # 连接池最大连接数
  pool-size: 4
  # 获取连接超时(毫秒)
  connection-timeout-ms: 5000
  # JDBC 附加参数
  extra-params: 'useSSL=false&characterEncoding=utf8&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai'
  # 启动时自动建表
  create-tables-on-start: true

  # ---------- MySQL 驱动自动加载 ----------
  # Paper 会用 plugin.yml 的 libraries 自动下载驱动;
  # Spigot 等不支持 libraries 的服务端, 插件会自己下载到
  # plugins/OfficialAuthentication/libs/ 并用独立类加载器加载, 无需手动改服务端。
  driver:
    # 是否允许自动下载(仅当服务端里找不到驱动时才下载)
    auto-download: true
    # 驱动版本
    version: '8.4.0'
    # 下载仓库, 按顺序尝试直到成功
    repositories:
      - 'https://maven.aliyun.com/repository/public'
      - 'https://repo1.maven.org/maven2'
    # 下载超时(毫秒)
    timeout-ms: 15000
    # 提示: 也可以手动把 mysql-connector-j-x.x.x.jar 丢进 libs 目录(插件会加载该目录下所有 jar)

# ============================================================
#  认证 / 缓存
# ============================================================
auth:
  # 【开关】认证有效期 / 过期重新认证
  #   false (默认, 推荐) = 绑定一次永久有效:
  #       认证一次后不用再回来刷新; 换 ID 后新 ID 自动绑定, 旧 ID 自动变离线
  #   true = 启用过期判定: 超过 expire-days 天没再进正版服就显示「已过期」
  expiry-enabled: false
  # 认证有效期(天), 支持小数, 0.5 = 12 小时; 仅 expiry-enabled: true 时生效
  expire-days: 30
  # 单条 SQL 超时(秒)
  query-timeout-seconds: 5

  # ---------- 主服缓存 ----------
  # 正版玩家结果缓存(秒)
  cache-seconds: 120
  # 离线/未认证玩家结果缓存(秒), 建议短一点, 让刚认证完的玩家尽快生效
  cache-offline-seconds: 20
  # 查询失败结果缓存(秒), 防止数据库异常时疯狂重试
  cache-error-seconds: 10
  # 缓存清理间隔(分钟)
  cache-purge-minutes: 10

  # ---------- 身份链 ----------
  # 历史昵称展示最大条数
  max-history-names: 8
  # 主服是否允许写入(默认 false, 保证数据源唯一可信)
  allow-main-write: false

# ============================================================
#  定时清理 (总开关: features.cleanup)
# ============================================================
cleanup:
  # 执行间隔(分钟)
  interval-minutes: 60
  # false = 仅把过期身份的昵称标记为「非当前」(推荐, 保留改名历史)
  # true  = 直接删除过期身份的记录
  delete-expired: false
  # 是否记录认证事件历史表 (AUTH / RENAME / RELEASE / UNLINK)
  history-enabled: true
  # 事件历史保留天数 (0 = 永久保留)
  history-retain-days: 180

# ============================================================
#  /zb 指令 (开关部分; 文案在 lang.yml 的 command 段)
# ============================================================
command:
  # 指令名, 可以写多个(第一个为主名), 和别的插件冲突时自动跳过
  names: [ 'zb', 'zhengban', 'renzheng' ]
  # 使用权限
  permission: 'officialauth.zb'
  # true = 必须拥有上面的权限才能用; false = 所有人可用
  permission-required: false
  # 查询其他玩家所需权限
  others-permission: 'officialauth.zb.others'

# ============================================================
#  认证成功提示 (开关部分; 文案在 lang.yml 的 bind-notify 段)
#  仅当 server.mode: AUTH 且本次写库成功时触发
# ============================================================
bind-notify:
  enabled: true
  # 触发时机:
  #   always = 每次成功认证都提示 (默认)
  #   change = 首次绑定 或 换绑(改名) 时才提示
  #   once   = 只在首次绑定时提示
  mode: always
  # 屏幕中央标题显示时间(tick, 20 tick = 1 秒): 淡入 / 停留 / 淡出
  fade-in: 10
  stay: 50
  fade-out: 10
  # 音效(留空则不播放), 支持 entity.player.levelup 或 ENTITY_PLAYER_LEVELUP 写法
  sound: 'ENTITY_PLAYER_LEVELUP'
  sound-volume: 1.0
  sound-pitch: 1.2

# ============================================================
#  控制台 (横幅内容在 lang.yml 的 console 段)
# ============================================================
console:
  # 是否打印启动横幅
  banner: true
  # 是否使用终端 ANSI 颜色码
  # 现代终端都支持; 若启动后看到 ←[38;2;...m 这类乱码, 改成 false 即可自动去色
  ansi: true
